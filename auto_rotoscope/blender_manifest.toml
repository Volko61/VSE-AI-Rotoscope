schema_version = "1.0.0"

id = "auto_rotoscope"
version = "0.1.0"
name = "Auto Rotoscope VSE"
tagline = "Segment and track objects in the VSE to export alpha mattes"
maintainer = "Volko <volkovolko76@gmail.com>"
type = "add-on"

website = "https://github.com/Volko61/VSE-AI-Rotoscope"

# Valid add-on tag. "Sequencer" targets the Video Sequence Editor.
tags = ["Sequencer"]

# Blender 5.1+ ships Python 3.13, which our cp313 wheels target. (Blender 4.2–5.0
# used Python 3.11 — targeting those would need cp311 wheels instead.)
blender_version_min = "5.1.0"

# SPDX. The add-on's own code is GPL-3.0-or-later; the bundled SAM 2.1 ONNX
# graphs are Apache-2.0 and onnxruntime is MIT — both GPL-compatible.
# Full texts ship in ./licenses/ (see NOTICE.txt).
license = ["SPDX:GPL-3.0-or-later"]
copyright = [
  "2026 Volko",
  "2024 Meta Platforms, Inc. (SAM 2.1 model weights, Apache-2.0)",
  "2018 Microsoft Corporation (onnxruntime, MIT)",
  "2000 OpenCV team (opencv-python-headless, Apache-2.0)",
]

# Per-OS builds via:  blender --command extension build --split-platforms
# macOS Intel is absent on purpose: the Blender Foundation stopped shipping
# macOS x86_64 builds at 5.0, and blender_version_min is 5.1, so no official
# Blender exists that a "macos-x64" package could be installed into.
platforms = ["windows-x64", "linux-x64", "macos-arm64"]

# --- Bundled wheels ------------------------------------------------------
# GENERATED by `python scripts/fetch_assets.py`, which downloads
# onnxruntime(-directml) + opencv-python-headless for cp313 win_amd64 and
# manylinux x86_64 into ./wheels/ and rewrites this block. numpy is NOT
# bundled — Blender provides it. --split-platforms picks the right wheels
# per OS, so each ZIP only carries its own.
# (Root-level key: must stay ABOVE every [table].)
wheels = [
  "./wheels/onnxruntime-1.23.2-cp313-cp313-macosx_13_0_arm64.whl",
  "./wheels/onnxruntime-1.27.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/onnxruntime_directml-1.24.4-cp313-cp313-win_amd64.whl",
  "./wheels/opencv_python_headless-4.10.0.84-cp37-abi3-macosx_11_0_arm64.whl",
  "./wheels/opencv_python_headless-4.10.0.84-cp37-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/opencv_python_headless-4.10.0.84-cp37-abi3-win_amd64.whl",
]

# Everything is bundled, so no network access is ever made and the `network`
# permission is deliberately not requested. Only file access is needed, to
# write the generated matte sequences.
[permissions]
files = "Write the generated alpha matte image sequences to disk"

[build]
# NOTE: declaring this key REPLACES Blender's defaults (which already exclude
# "/.git/" and "/*.zip"), so they have to be repeated here. Omitting "*.zip" is
# how a previously built package ends up nested inside the next one.
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "*.part",
  "*.zip",
  "/.git/",
  "/dist/",
]
